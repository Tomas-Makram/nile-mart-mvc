<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart - Categories</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }

        tr.parent-row td { font-weight: bold; background: #eef3f8; }
        tr.child td:first-child { padding-left: 36px; color: #555; font-size: 14px; }

        .prefix { color: #999; margin-right: 4px; }
        .badge { padding: 4px 10px; border-radius: 12px; color: white; font-size: 12px; font-weight: bold; }
        .badge-yes { background: #28a745; }
        .badge-no  { background: #dc3545; }
        .empty { text-align: center; color: #888; font-style: italic; }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-row h1 {
            margin: 0;
        }

        .btn-add {
            display: inline-block;
            padding: 10px 18px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-add:hover {
            background-color: #218838;
        }

    </style>
</head>

<body>

<div class="header-row">
    <h1>Categories</h1>
    <a th:href="@{/categories/new}" class="btn-add">+ Add New Category</a>
</div>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Parent</th>
        <th>Order</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${#maps.isEmpty(allCategories)}">
        <td colspan="5" class="empty">No categories found</td>
    </tr>

    <!-- entry.key = parentSlug, entry.value -->
    <th:block th:each="entry : ${allCategories}">
        <tr th:each="cat : ${entry.value}"
            th:classappend="${cat.child ? 'child' : 'parent-row'}">

            <td>
                <span th:if="${cat.child}" class="prefix">|-></span>
                <span th:text="${cat.categoryName}"></span>
            </td>

            <td th:text="${cat.slug}"></td>

            <!-- parentSlug ( — or top-level) -->
            <td th:text="${cat.parentSlug != null ? cat.parentSlug : '--'}"></td>

            <td th:text="${cat.displayOrder}"></td>

            <td>
                <span th:if="${cat.active}"  class="badge badge-yes">Yes</span>
                <span th:unless="${cat.active}" class="badge badge-no">No</span>
            </td>
        </tr>
    </th:block>
    </tbody>
</table>

</body>
</html>
